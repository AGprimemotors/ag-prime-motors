<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AG Prime Motors | Dealer Inventory</title><style>:root{--red:#d71920;--bg:#080a0c;--panel:#111519;--line:#252b31;--text:#f7f7f7;--muted:#aeb5bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.logo{font-size:22px;font-weight:900;letter-spacing:1px}.logo b{color:var(--red)}button,.btn{border:0;border-radius:6px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:white}.secondary{background:#252b31;color:white}.danger{background:#8f1116;color:white}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}.login{max-width:420px;margin:10vh auto}.h{font-size:30px;margin:0 0 8px}.muted{color:var(--muted)}input,textarea,select{width:100%;background:#0a0d10;border:1px solid #343b42;color:white;border-radius:6px;padding:12px;margin:6px 0 14px;font:inherit}textarea{min-height:120px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.row:last-child{border-bottom:0}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumb{width:90px;height:65px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}.vehicle-title{font-size:20px;font-weight:800}.price{font-size:20px;font-weight:900}.hidden{display:none!important}.msg{margin:10px 0;padding:10px;border-radius:6px;background:#182026}.error{background:#3b1517}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body>
<div id="loginView" class="wrap"><div class="card login"><div class="logo">AG <b>PRIME</b> MOTORS</div><h1 class="h">Dealer Login</h1><p class="muted">Private inventory management</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required value="agprimemotorsllc@gmail.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Log In</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="logo">AG <b>PRIME</b> MOTORS</div><div class="muted">Inventory Dashboard</div></div><div class="actions"><button id="addBtn" class="primary">+ Add Vehicle</button><button id="logoutBtn" class="secondary">Log Out</button></div></div><div id="message"></div>
<div id="editor" class="card hidden"><h2 id="editorTitle">Add Vehicle</h2><form id="vehicleForm"><input id="vehicleId" type="hidden"><div class="grid"><div><label>Year</label><input id="year" type="number" required></div><div><label>Make</label><input id="make" required></div><div><label>Model</label><input id="model" required></div><div><label>Price</label><input id="price" type="number" step="0.01" required></div><div><label>Mileage</label><input id="mileage" type="number" required></div><div><label>VIN</label><input id="vin"></div><div><label>Status</label><select id="status"><option value="available">Available</option><option value="sold">Sold</option><option value="hidden">Hidden</option></select></div><div><label>Featured</label><select id="featured"><option value="false">No</option><option value="true">Yes</option></select></div></div><label>Description</label><textarea id="description"></textarea><label>Features — one per line</label><textarea id="features" placeholder="AWD\nLeather Heated Seats\nNavigation"></textarea><label>Photos</label><input id="photos" type="file" accept="image/*" multiple><p class="muted">Select all photos at once. New photos upload to your Supabase vehicle-photos bucket.</p><div id="existingPhotos" class="thumbs"></div><div class="actions"><button class="primary" type="submit">Save Vehicle</button><button id="cancelBtn" class="secondary" type="button">Cancel</button></div></form></div>
<div class="card"><h2>Current Inventory</h2><div id="inventory"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let editingPhotos=[];const $=id=>document.getElementById(id);const parseList=v=>{if(Array.isArray(v))return v;try{return JSON.parse(v||'[]')}catch{return String(v||'').split('\\n').map(x=>x.trim()).filter(Boolean)}};const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,e=false){$('message').innerHTML=t?`<div class="msg ${e?'error':''}">${clean(t)}</div>`:''}function loginMsg(t,e=false){$('loginMsg').innerHTML=t?`<div class="msg ${e?'error':''}">${clean(t)}</div>`:''}
async function refresh(){const {data,error}=await sb.from('Vehicles').select('*').order('created_at',{ascending:false});if(error)return msg(error.message,true);$('inventory').innerHTML=data.length?data.map(v=>`<div class="row"><div><div class="vehicle-title">${clean(v.year)} ${clean(v.Make)} ${clean(v.model)}</div><div class="muted">${Number(v.mileage||0).toLocaleString()} miles • ${clean(v.status)}</div></div><div class="actions"><span class="price">$${Number(v.price||0).toLocaleString()}</span><button class="secondary" onclick="editVehicle('${v.id}')">Edit</button><button class="danger" onclick="deleteVehicle('${v.id}')">Delete</button></div></div>`).join(''):'<p class="muted">No vehicles yet. Add your first vehicle.</p>'}
function openEditor(v=null){$('editor').classList.remove('hidden');$('editorTitle').textContent=v?'Edit Vehicle':'Add Vehicle';editingPhotos=v?parseList(v.photos):[];['vehicleId','year','make','model','price','mileage','vin','description'].forEach(id=>$(id).value=v?(id==='make'?(v.Make??''):(v[id]??'')):'');$('status').value=v?.status||'available';$('featured').value=String(v?.featured||false);$('features').value=parseList(v?.features).join('\n');$('photos').value='';renderExisting();window.scrollTo({top:0,behavior:'smooth'})}
function renderExisting(){$('existingPhotos').innerHTML=editingPhotos.map((u,i)=>`<div style="position:relative"><img class="thumb" src="${clean(u)}"><button type="button" onclick="removePhoto(${i})" style="position:absolute;right:0;top:0;padding:3px 6px">×</button></div>`).join('')}
window.removePhoto=i=>{editingPhotos.splice(i,1);renderExisting()};window.editVehicle=async id=>{const {data,error}=await sb.from('Vehicles').select('*').eq('id',id).single();if(error)return msg(error.message,true);openEditor(data)};
window.deleteVehicle=async id=>{if(!confirm('Delete this vehicle from the website?'))return;const {error}=await sb.from('Vehicles').delete().eq('id',id);if(error)return msg(error.message,true);msg('Vehicle deleted.');refresh()};
$('loginForm').onsubmit=async e=>{e.preventDefault();loginMsg('');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return loginMsg(error.message,true);showApp()};async function showApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');refresh()}$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('addBtn').onclick=()=>openEditor();$('cancelBtn').onclick=()=>{$('editor').classList.add('hidden')};
$('vehicleForm').onsubmit=async e=>{e.preventDefault();msg('Saving...');const user=(await sb.auth.getUser()).data.user;if(!user)return;let photos=[...editingPhotos];for(const f of [...$('photos').files]){const path=`${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('vehicle-photos').upload(path,f,{upsert:false});if(up.error)return msg(up.error.message,true);const {data}=sb.storage.from('vehicle-photos').getPublicUrl(path);photos.push(data.publicUrl)}const payload={year:+$('year').value,Make:$('make').value,model:$('model').value,price:+$('price').value,mileage:+$('mileage').value,description:$('description').value,photos:JSON.stringify(photos),status:$('status').value,featured:$('featured').value==='true',vin:$('vin').value,features:JSON.stringify($('features').value.split('\n').map(x=>x.trim()).filter(Boolean))};const id=$('vehicleId').value;const result=id?await sb.from('Vehicles').update(payload).eq('id',id):await sb.from('Vehicles').insert(payload);if(result.error)return msg(result.error.message,true);msg(id?'Vehicle updated.':'Vehicle added.');$('editor').classList.add('hidden');refresh()};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)showApp()})();
</script></body></html>
