<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AG Prime Motors | Vehicle</title><style>body{margin:0;background:#080a0c;color:#f7f7f7;font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.logo{font-size:22px;font-weight:900}.logo b{color:#d71920}.back{display:inline-block;margin:10px 0 25px;color:#bbb}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:25px}.mainimg{width:100%;height:520px;object-fit:cover;border-radius:8px;background:#15191d}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.thumb{width:100%;height:90px;object-fit:cover;border-radius:5px;cursor:pointer}.panel{background:#111519;border:1px solid #252b31;border-radius:8px;padding:24px}.eyebrow{color:#ff5258;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.title{font-size:44px;line-height:1;margin:12px 0}.price{font-size:32px;font-weight:900;margin:20px 0}.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spec{border-bottom:1px solid #252b31;padding:12px 0}.spec small{display:block;color:#858d94;text-transform:uppercase;font-size:10px;margin-bottom:3px}.features{margin-top:25px;line-height:1.8;color:#c9ced2}.btn{display:block;background:#d71920;padding:15px;text-align:center;border-radius:5px;font-weight:800;margin-top:20px}@media(max-width:800px){.hero{grid-template-columns:1fr}.mainimg{height:350px}.title{font-size:36px}.thumb{height:65px}}</style></head><body><div class="wrap"><div class="logo">AG <b>PRIME</b> MOTORS</div><a class="back" href="index.html">← Back to Inventory</a><div id="app">Loading...</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=v=>{if(Array.isArray(v))return v;try{return JSON.parse(v||'[]')}catch{return String(v||'').split('\\n').map(x=>x.trim()).filter(Boolean)}};
async function load(){if(!id)return document.getElementById('app').innerHTML='Vehicle not found.';const {data:v,error}=await sb.from('Vehicles').select('*').eq('id',id).eq('status','available').single();if(error||!v)return document.getElementById('app').innerHTML='Vehicle not found or no longer available.';const photos=list(v.photos),features=list(v.features),first=photos[0]||'lexus-01.jpeg';document.title=`AG Prime Motors | ${v.year} ${v.Make} ${v.model}`;document.getElementById('app').innerHTML=`<div class="hero"><div><img id="main" class="mainimg" src="${esc(first)}" alt="${esc(v.year+' '+v.Make+' '+v.model)}"><div class="thumbs">${photos.map(p=>`<img class="thumb" src="${esc(p)}" onclick="document.getElementById('main').src=this.src">`).join('')}</div></div><div class="panel"><div class="eyebrow">${v.featured?'Featured Inventory':'Available Now'}</div><h1 class="title">${esc(v.year+' '+v.Make+' '+v.model)}</h1><div class="price">$${Number(v.price||0).toLocaleString()} <span style="font-size:14px;font-weight:400">+ Tax, Reg & Doc</span></div><div class="specs"><div class="spec"><small>Mileage</small>${Number(v.mileage||0).toLocaleString()} miles</div><div class="spec"><small>Title</small>Clean Title</div>${v.vin?`<div class="spec"><small>VIN</small>${esc(v.vin)}</div>`:''}</div><a class="btn" href="tel:5302911914">Call / Text 530-291-1914</a></div></div><div class="panel" style="margin-top:25px"><div class="eyebrow">Vehicle Details</div><h2>Description</h2><p style="line-height:1.7;color:#c9ced2;white-space:pre-line">${esc(v.description)}</p><h2>Features</h2><div class="features">${features.map(x=>'• '+esc(x)).join('<br>')}</div></div>`}load();
</script></body></html>
